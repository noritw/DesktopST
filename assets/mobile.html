    nrRender();
    const st = await api('/api/news/reader/state');
    if (st.error) {
      readerState.loading = false;
      readerState.error = '讀不到新聞報設定';
      nrRender();
      return;
    }
    readerState.enabled = st.enabled !== false;
    readerState.sources = st.sources || [];
    readerState.keywordGroups = st.keywordGroups || [];
    readerState.readerKeywordGroupIds = st.readerKeywordGroupIds || [];
    readerState.readerMaxItems = st.readerMaxItems || 30;
    readerState.readerPerKeyword = st.readerPerKeyword || 3;
    readerState.readerBreakoutQuota = typeof st.readerBreakoutQuota === 'number' ? st.readerBreakoutQuota : 3;
    readerState.pinnedItems = st.pinnedItems || [];
    readerState.dismissedIds = st.dismissedIds || [];
    readerState.loaded = true;
    if (!readerState.enabled) { readerState.loading = false; nrRender(); return; }
    await nrFetchBatch(false);
  }

  /**
   * 抓一批。excludeCurrent＝「換一批」：排除畫面上全部（含釘選）以免抽到重複的，
   * 釘選的在本地併回來。桌面版還會依每欄配額做細部併回，手機這裡簡化為
   * 「釘選的一律保留，分欄時各自歸位」，行為好預測、不需要維護第二份配額演算法。
   */
  async function nrFetchBatch(excludeCurrent) {
    readerState.loading = true; readerState.error = null;
    nrRender();
    const pinned = readerState.pinnedItems;
    const excludeIds = excludeCurrent
      ? readerState.items.map(i => i.id)
      : pinned.map(p => p.id);
    const r = await api('/api/news/reader/batch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ excludeIds, strictExclude: !!excludeCurrent })
    });
    readerState.loading = false;
    if (r.error || r.ok === false) {
      readerState.error = r.error || '抓取失敗';
      nrRender();
      return;
    }
    nrApplySnapshot(r);
    const dismissed = new Set(readerState.dismissedIds);
    const fresh = (r.items || []).filter(i => !dismissed.has(i.id));
    const freshIds = new Set(fresh.map(i => i.id));
    const keptPins = pinned.filter(p => !freshIds.has(p.id) && !dismissed.has(p.id));
    readerState.items = keptPins.concat(fresh);
    readerState.fetchedAt = r.fetchedAt || Date.now();
    nrRender();
  }

  async function nrRefreshSection(sectionGroupId) {
    readerState.refreshingSection = sectionGroupId;
    nrRender();
    const current = readerState.items.filter(i => nrSectionOf(i) === sectionGroupId);
    const r = await api('/api/news/reader/section', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sectionGroupId,
        excludeIds: current.filter(i => !nrIsPinned(i.id)).map(i => i.id),
        strictExclude: true
      })
    });
    readerState.refreshingSection = null;
    if (r.error || r.ok === false) { showToast(r.error || '重抓失敗'); nrRender(); return; }
    nrApplySnapshot(r);
    nrReplaceSection(sectionGroupId, r.items || []);
    nrRender();
  }

  /** 這則新聞屬於哪一欄（與 nrGroupByKeyword 同規則） */
  function nrSectionOf(item) {
    if (item.breakout === true) return NR_BREAKOUT_ID;
    if (String(item.sourceId || '').indexOf('loc-') === 0) return NR_LOCAL_ID;
    const src = readerState.sources.find(s => s.id === item.sourceId);
    if ((src && src.type === 'keyword') || item.sourceType === 'keyword') return 'kw:' + (src ? src.id : item.sourceId);
    if (src) return 'feed:' + src.id;
    return NR_OTHER_ID;
  }

  function nrReplaceSection(sectionGroupId, freshItems) {
    const dismissed = new Set(readerState.dismissedIds);
    const kept = readerState.items.filter(i => nrSectionOf(i) !== sectionGroupId || nrIsPinned(i.id));
    const keptIds = new Set(kept.map(i => i.id));
    const fresh = freshItems.filter(i => !dismissed.has(i.id) && !keptIds.has(i.id));
    readerState.items = kept.concat(fresh);
  }

  function nrApplySnapshot(r) {
    if (Array.isArray(r.sources)) readerState.sources = r.sources;
    if (Array.isArray(r.keywordGroups)) readerState.keywordGroups = r.keywordGroups;
    if (Array.isArray(r.readerKeywordGroupIds)) readerState.readerKeywordGroupIds = r.readerKeywordGroupIds;
    if (typeof r.readerMaxItems === 'number') readerState.readerMaxItems = r.readerMaxItems;
    if (typeof r.readerPerKeyword === 'number') readerState.readerPerKeyword = r.readerPerKeyword;
    if (typeof r.readerBreakoutQuota === 'number') readerState.readerBreakoutQuota = r.readerBreakoutQuota;
  }

  // ── 共用狀態寫回 ──
  function nrSavePinned() {
    void api('/api/news/reader/pinned', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: readerState.pinnedItems })
    });
  }
  function nrSaveDismissed() {
    void api('/api/news/reader/dismissed', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: readerState.dismissedIds })
    });
  }

  function nrTogglePin(item) {
    const exists = nrIsPinned(item.id);
    readerState.pinnedItems = exists
      ? readerState.pinnedItems.filter(p => p.id !== item.id)
      : readerState.pinnedItems.concat([item]);
    nrSavePinned();
    nrRender();
  }

  function nrDismiss(item) {
    if (readerState.dismissedIds.indexOf(item.id) < 0) {
      readerState.dismissedIds = readerState.dismissedIds.concat([item.id]).slice(-500);
      nrSaveDismissed();
    }
    if (nrIsPinned(item.id)) {
      readerState.pinnedItems = readerState.pinnedItems.filter(p => p.id !== item.id);
      nrSavePinned();
    }
    readerState.items = readerState.items.filter(i => i.id !== item.id);
    nrRender();
  }

  /** 桌面版是在桌機開發話視窗；手機版丟進手機自己的輸入框才合理（人在外面） */
  function nrInsertToInput(item) {
    const text = item.summary ? item.title + '\n' + item.summary : item.title;
    const cur = $msgInput.value;
    $msgInput.value = cur ? cur.replace(/\s*$/, '') + '\n' + text : text;
    resizeTA();
    closeSheet('reader-overlay');
    $msgInput.focus();
    showToast('已放進輸入框');
  }

  function nrOpenOriginal(item) {
    if (item.sourceId) {
      void api('/api/news/mark-opened', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sourceId: item.sourceId })
      });
    }
    if (item.url) window.open(item.url, '_blank', 'noopener');
  }

  // ── 渲染 ──
  function nrRender() {
    nrRenderToolbar();
    nrRenderOptions();
    nrRenderTabs();
    nrRenderBody();
    $readerFetched.textContent = readerState.fetchedAt
      ? '更新於 ' + new Date(readerState.fetchedAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
      : '';
    $readerRefresh.disabled = readerState.loading || !readerState.enabled;
    $readerRefresh.textContent = readerState.loading ? '抓取中…' : '🔄 換一批';
  }

  function nrRenderToolbar() {
    // 兩顆都標明「現在是什麼狀態」，避免只寫「標題」「欄位」看不出是開關還是分類
    const dBtn = document.getElementById('reader-display-btn');
    dBtn.textContent = readerState.displayMode === 'title' ? '顯示：標題' : '顯示：標題＋摘要';
    const oBtn = document.getElementById('reader-options-btn');
    oBtn.classList.toggle('on', readerState.optionsOpen);
    // 收合時 ▶、展開時 ▲，兩者同一套實心三角形，一眼看得出是同一顆開關的兩個狀態
    oBtn.textContent = readerState.optionsOpen ? '▲ 收合欄位設定' : '▶ 欄位設定';
  }

  /**
   * 欄位順序清單要顯示哪些關鍵字來源。
   * 必須跟著「要抓哪些關鍵字組」走：沒選＝全部組，有選＝只列那幾組的關鍵字，
   * 否則切了組卻看到同一份清單，會以為切換沒生效。
   */
  function nrVisibleKeywordSources() {
    const selected = readerState.readerKeywordGroupIds;
    return readerState.sources.filter(s => {
      if (s.type !== 'keyword' || !s.enabled) return false;
      if (s.origin === 'location') return false;
      if (selected.length === 0) return true;
      return selected.indexOf(s.groupId || 'default') >= 0;
    });
  }

  function nrGroupNameOf(src) {
    const gid = src.groupId || 'default';
    const g = readerState.keywordGroups.find(x => x.id === gid);
    return g ? g.name : '';
  }

  function nrRenderOptions() {
    $readerOptions.style.display = readerState.optionsOpen ? '' : 'none';
    if (!readerState.optionsOpen) return;
    $readerOptions.innerHTML = '';

    // 面板自己的標題列與收合鈕：右上角那顆 ✕ 是關掉整個新聞報，不是關這一區
    const head = nEl2('div', 'nr-opt-head');
    head.appendChild(nEl2('span', 'nr-opt-heading', '欄位設定'));
    const doneBtn = nEl2('button', 'nr-opt-done', '完成');
    doneBtn.type = 'button';
    doneBtn.addEventListener('click', () => {
      readerState.optionsOpen = false;
      nrRender();
    });
    head.appendChild(doneBtn);
    $readerOptions.appendChild(head);

    // 關鍵字組多選
    if (readerState.keywordGroups.length > 0) {
      $readerOptions.appendChild(nEl2('div', 'nr-opt-title', '要抓哪些關鍵字組'));
      const row = nEl2('div', 'nr-chiprow');
      const selected = readerState.readerKeywordGroupIds;
      const allBtn = nEl2('button', 'nr-chip' + (selected.length === 0 ? ' on' : ''), '全部組');
      allBtn.type = 'button';
      allBtn.addEventListener('click', () => nrSetGroups([]));
      row.appendChild(allBtn);
      for (const g of readerState.keywordGroups) {
        const on = selected.indexOf(g.id) >= 0;
        const btn = nEl2('button', 'nr-chip' + (on ? ' on' : ''), g.name);
        btn.type = 'button';
        btn.addEventListener('click', () => {
          const next = on ? selected.filter(x => x !== g.id) : selected.concat([g.id]);
          nrSetGroups(next);
        });
        row.appendChild(btn);
      }
      $readerOptions.appendChild(row);
    }

    // 欄位順序（手機不做拖曳，改上下移）
    const kwSources = nrVisibleKeywordSources();
    const showGroupTag = readerState.readerKeywordGroupIds.length === 0
      && readerState.keywordGroups.length > 1;
    if (kwSources.length > 1) {
      $readerOptions.appendChild(nEl2('div', 'nr-opt-title', '欄位順序'));
      kwSources.forEach((src, idx) => {
        const row = nEl2('div', 'nr-orderrow');
        row.appendChild(nEl2('span', 'nr-ordername', src.label));
        // 顯示全部組時標一下每個關鍵字屬於哪組，才知道清單為什麼混在一起
        if (showGroupTag) {
          const tag = nrGroupNameOf(src);
          if (tag) row.appendChild(nEl2('span', 'nr-ordergroup', tag));
        }
        const up = nEl2('button', 'nr-movebtn', '▲');
        up.type = 'button'; up.disabled = idx === 0;
        up.addEventListener('click', () => nrMoveSource(src.id, -1));
        const down = nEl2('button', 'nr-movebtn', '▼');
        down.type = 'button'; down.disabled = idx === kwSources.length - 1;
        down.addEventListener('click', () => nrMoveSource(src.id, 1));
        row.appendChild(up); row.appendChild(down);
        $readerOptions.appendChild(row);
      });
    } else if (kwSources.length === 1) {
      $readerOptions.appendChild(nEl2('div', 'nr-opt-title', '欄位順序'));
      $readerOptions.appendChild(nEl2('div', 'nr-opt-note',
        '這組只有「' + kwSources[0].label + '」一個關鍵字，沒有順序可調。'));
    } else {
      $readerOptions.appendChild(nEl2('div', 'nr-opt-title', '欄位順序'));
      $readerOptions.appendChild(nEl2('div', 'nr-opt-note', '選取的組裡沒有啟用中的關鍵字。'));
    }
  }

  function nrRenderTabs() {
    $readerTabs.innerHTML = '';
    const sections = nrGroupByKeyword(readerState.items, readerState.sources);
    // 目前分頁所屬的欄已經沒東西了 → 退回「全部」
    if (readerState.activeTab !== 'all' && !sections.some(s => s.groupId === readerState.activeTab)) {
      readerState.activeTab = 'all';
      localStorage.setItem(NR_LS_TAB, 'all');
    }
    const mk = (id, label) => {
      const btn = nEl2('button', 'tab-btn' + (readerState.activeTab === id ? ' active' : ''), label);
      btn.type = 'button';
      btn.addEventListener('click', () => {
        readerState.activeTab = id;
        localStorage.setItem(NR_LS_TAB, id);
        nrRender();
        $readerBody.scrollTop = 0;
      });
      return btn;
    };
    $readerTabs.appendChild(mk('all', '全部'));
    for (const sec of sections) $readerTabs.appendChild(mk(sec.groupId, sec.label));
  }

  function nrRenderBody() {
    $readerBody.innerHTML = '';

    if (!readerState.enabled) {
      $readerBody.appendChild(nEl2('div', 'nr-empty',
        '新聞模組尚未啟用。\n請在電腦上的「設定 → 擴充」把新聞陪聊打開，就能在這裡看新聞報。'));
      return;
    }
    if (readerState.loading && readerState.items.length === 0) {
      for (let i = 0; i < 5; i++) $readerBody.appendChild(nEl2('div', 'nr-skeleton'));
      return;
    }
    if (readerState.error) {
      const box = nEl2('div', 'nr-empty', readerState.error);
      const retry = nEl2('button', 'nr-optbtn', '重試');
      retry.type = 'button';
      retry.style.marginTop = '12px';
      retry.addEventListener('click', () => void nrFetchBatch(false));
      box.appendChild(document.createElement('br'));
      box.appendChild(retry);
      $readerBody.appendChild(box);
      return;
    }

    const sections = nrGroupByKeyword(readerState.items, readerState.sources);
    const shown = readerState.activeTab === 'all'
      ? sections
      : sections.filter(s => s.groupId === readerState.activeTab);

    if (shown.length === 0) {
      $readerBody.appendChild(nEl2('div', 'nr-empty',
        '目前沒有新聞。\n可以按下面的「換一批」，或在電腦上調整關鍵字。'));
      return;
    }

    for (const sec of shown) {
      const secEl = nEl2('div', 'nr-section');
      const head = nEl2('div', 'nr-section-head');
      head.appendChild(nEl2('span', 'nr-section-name', sec.label + '（' + sec.items.length + '）'));

      // 熱門／關鍵字欄才有獨立配額；地方／訂閱改的是全域預設，一樣給輸入框
      const quota = nEl2('input', 'nr-quota');
      quota.type = 'number'; quota.inputMode = 'numeric';
      quota.min = '0'; quota.max = '20';
      quota.value = String(nrSectionQuota(sec.groupId));
      quota.title = '此欄抓取則數';
      quota.addEventListener('change', () => {
        const n = Math.max(0, Math.min(20, Math.floor(Number(quota.value))));
        if (!isFinite(n)) return;
        void nrSetQuota(sec.groupId, n);
      });
      head.appendChild(quota);

      const refreshBtn = nEl2('button', 'nr-secbtn',
        readerState.refreshingSection === sec.groupId ? '重抓中…' : '↻ 重抓');
      refreshBtn.type = 'button';
      refreshBtn.disabled = readerState.refreshingSection != null;
      refreshBtn.addEventListener('click', () => void nrRefreshSection(sec.groupId));
      head.appendChild(refreshBtn);
      secEl.appendChild(head);

      // 釘選的排前面
      const ordered = sec.items.slice().sort((a, b) => (nrIsPinned(b.id) ? 1 : 0) - (nrIsPinned(a.id) ? 1 : 0));
      for (const item of ordered) secEl.appendChild(nrRenderCard(item));
      $readerBody.appendChild(secEl);
    }
  }

  function nrRenderCard(item) {
    const pinned = nrIsPinned(item.id);
    const card = nEl2('div', 'nr-card' + (pinned ? ' pinned' : ''));
    card.appendChild(nEl2('div', 'nr-card-title', item.title));
    if (readerState.displayMode === 'title-summary' && item.summary) {
      card.appendChild(nEl2('div', 'nr-card-summary', item.summary));
    }
    const meta = [item.source, nrFormatTime(item.publishedAt)].filter(Boolean).join(' · ');
    if (meta) card.appendChild(nEl2('div', 'nr-card-meta', meta));

    const actions = nEl2('div', 'nr-card-actions');
    if (item.url) {
      const open = nEl2('button', 'nr-act', '↗ 原文');
      open.type = 'button';
      open.addEventListener('click', () => nrOpenOriginal(item));
      actions.appendChild(open);
    }
    const pin = nEl2('button', 'nr-act' + (pinned ? ' on' : ''), pinned ? '📌 已釘' : '📌 釘選');
    pin.type = 'button';
    pin.addEventListener('click', () => nrTogglePin(item));
    actions.appendChild(pin);

    const chat = nEl2('button', 'nr-act', '💬 聊這個');
    chat.type = 'button';
    chat.addEventListener('click', () => nrInsertToInput(item));
    actions.appendChild(chat);

    const skip = nEl2('button', 'nr-act', '✕ 不看了');
    skip.type = 'button';
    skip.addEventListener('click', () => nrDismiss(item));
    actions.appendChild(skip);

    card.appendChild(actions);
    return card;
  }

  // ── 設定寫回 ──
  async function nrSetGroups(ids) {
    readerState.readerKeywordGroupIds = ids;
    nrRender();
    const r = await api('/api/news/reader/groups', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids })
    });
    if (r.error) { showToast('設定失敗'); return; }
    await nrFetchBatch(false);
  }

  async function nrSetQuota(sectionGroupId, quota) {
    readerState.refreshingSection = sectionGroupId;
    nrRender();
    const r = await api('/api/news/reader/quota', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sectionGroupId, quota })
    });
    readerState.refreshingSection = null;
    if (r.error || r.ok === false) { showToast(r.error || '設定失敗'); nrRender(); return; }
    nrApplySnapshot(r);
    nrReplaceSection(sectionGroupId, r.items || []);
    nrRender();
  }

  async function nrMoveSource(sourceId, delta) {
    const all = readerState.sources.slice();
    const idx = all.findIndex(s => s.id === sourceId);
    if (idx < 0) return;
    // 只在「目前清單上看得到的關鍵字」之間交換位置，跳過中間夾雜的其他組與訂閱來源，
    // 這樣畫面上按 ▲ 就真的跟上一列對調，不會跳到看不見的項目上。
    const visibleIds = new Set(nrVisibleKeywordSources().map(s => s.id));
    const visibleIdx = all.map((s, i) => (visibleIds.has(s.id) ? i : -1)).filter(i => i >= 0);
    const posInVisible = visibleIdx.indexOf(idx);
    const targetIdx = visibleIdx[posInVisible + delta];
    if (targetIdx == null) return;
    const tmp = all[idx]; all[idx] = all[targetIdx]; all[targetIdx] = tmp;
    readerState.sources = all;
    nrRender();
    const r = await api('/api/news/reader/order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderedSourceIds: all.map(s => s.id) })
    });
    if (r.error) { showToast('排序儲存失敗'); return; }
    if (Array.isArray(r.sources)) { readerState.sources = r.sources; nrRender(); }
  }

  function nEl2(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  document.getElementById('reader-btn').addEventListener('click', () => void openReaderPanel());
  document.getElementById('reader-close').addEventListener('click', () => closeSheet('reader-overlay'));
  document.getElementById('reader-display-btn').addEventListener('click', () => {
    readerState.displayMode = readerState.displayMode === 'title' ? 'title-summary' : 'title';
    localStorage.setItem(NR_LS_DISPLAY, readerState.displayMode);
    nrRender();
  });
  document.getElementById('reader-options-btn').addEventListener('click', () => {
    readerState.optionsOpen = !readerState.optionsOpen;
    nrRender();
  });
  $readerRefresh.addEventListener('click', () => void nrFetchBatch(true));
  // ╚═══ 個人新聞報邏輯區結束 ═══╝

  // ── Util ──
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── 回到前景時對帳 ──
  // 手機切走／鎖屏時 WS 常被系統靜默關閉，close 事件的重連排程也可能被凍結，
  // 回來時主動確認連線狀態並重抓一次，避免畫面停在離開前的舊訊息。
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (!ws) connectWS();                              // 已斷線：重連，補抓交給 open 事件
    else if (ws.readyState !== WebSocket.OPEN) fetchState();  // CONNECTING／CLOSING：先補一次畫面
    else fetchState();
  });

  // ── Init ──
  fetchState().then(() => { fetchLibrary(); connectWS(); initRemoteControl(); });
})();
</script>
</body>
</html>
