<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#CBFBC4">
<title>DesktopST</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --mint: #CBFBC4;
    --mint2: #AAEEDD;
    --sky: #AAEEFF;
    --butter: #FFE8AA;
    --pink: #FFBBBB;
    --bg: #F7FFFC;
    --surface: #ffffff;
    --user-bubble: #AAEEFF;
    --text: #3D5A52;
    --text-sub: #7AA898;
    --border: rgba(0,0,0,0.08);
    --radius: 16px;
    --radius-sm: 10px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; overscroll-behavior: none; }

  body { display: flex; flex-direction: column; height: 100dvh; }

  /* ── Header ── */
  #header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px 8px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--mint);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #char-avatars { display: flex; gap: 6px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  #char-avatars::-webkit-scrollbar { display: none; }
  .char-avatar-wrap { position: relative; flex-shrink: 0; cursor: pointer; }
  .char-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(255,255,255,0.7); background: var(--mint2); display: block; }
  .char-avatar-ph { width: 38px; height: 38px; border-radius: 50%; background: var(--mint2);
    display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .char-avatar-wrap.muted .char-avatar,
  .char-avatar-wrap.muted .char-avatar-ph { opacity: 0.35; }
  .char-avatar-wrap.muted::after {
    content: '🔇'; position: absolute; bottom: -2px; right: -2px;
    font-size: 12px; line-height: 1; background: var(--surface); border-radius: 50%; padding: 1px;
  }
  #header-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.6); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; color: var(--text);
    transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
  .icon-btn:active { background: rgba(255,255,255,0.9); }

  /* ── PC menu dropdown ── */
  #pc-menu-wrap { position: relative; }
  #pc-menu { display: none; position: absolute; top: 42px; right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    min-width: 175px; padding: 4px; z-index: 300; }
  #pc-menu.visible { display: block; }
  .pc-menu-item { display: block; width: 100%; text-align: left;
    background: none; border: none; padding: 9px 12px; border-radius: 8px;
    font-size: 14px; color: var(--text); cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent; white-space: nowrap; }
  .pc-menu-item:active { background: var(--mint); }
  .pc-menu-item:disabled { opacity: 0.45; cursor: default; }
  .pc-menu-item:disabled:active { background: none; }
  .pc-menu-info { padding: 7px 12px 4px; font-size: 12px; color: var(--text-sub); white-space: nowrap; }
  .pc-menu-sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* ── PC windows/displays sheet ── */
  #pc-sheet-overlay { display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.25); z-index: 400; align-items: flex-end; }
  #pc-sheet-overlay.visible { display: flex; }
  #pc-sheet { width: 100%; background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
    display: flex; flex-direction: column; max-height: 70dvh; }
  #pc-sheet-header { padding: 14px 16px 0; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0; }
  #pc-sheet-title { font-size: 15px; font-weight: 600; }
  #pc-sheet-close { background: none; border: none; font-size: 20px; cursor: pointer;
    color: var(--text-sub); padding: 0 4px; }
  #pc-sheet-body { overflow-y: auto; flex: 1; padding: 8px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  #pc-sheet-loading { text-align: center; padding: 24px; color: var(--text-sub); font-size: 14px; }
  .pc-win-item { display: flex; flex-direction: column; padding: 10px 8px;
    border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 8px;
    -webkit-tap-highlight-color: transparent; }
  .pc-win-item:active { background: var(--mint); }
  .pc-win-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc-win-proc { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  .pc-disp-item { display: flex; align-items: center; padding: 12px 8px;
    border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 8px; gap: 10px;
    -webkit-tap-highlight-color: transparent; }
  .pc-disp-item:active { background: var(--mint); }
  .pc-disp-item.selected { background: var(--mint); }
  .pc-disp-label { font-size: 14px; flex: 1; }
  .pc-disp-check { font-size: 16px; }

  /* ── Chat ── */
  #chat { flex: 1; overflow-y: auto; padding: 12px 12px 4px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch; }

  .msg { display: flex; gap: 8px; max-width: 88%; align-items: flex-end; }
  .msg.user { align-self: flex-end; }
  .msg.character, .msg.system { align-self: flex-start; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
    flex-shrink: 0; background: var(--mint2); }
  .msg-avatar-ph { width: 32px; height: 32px; border-radius: 50%; background: var(--mint2);
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .msg-col { display: flex; flex-direction: column; }
  .char-name { font-size: 12px; color: var(--text-sub); margin-bottom: 2px; padding-left: 4px; }
  .bubble { padding: 9px 13px; border-radius: 18px; line-height: 1.5;
    word-break: break-word; white-space: pre-wrap; font-size: 15px; }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.character .bubble { background: var(--surface); border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .msg.system .bubble { background: transparent; color: var(--text-sub);
    font-size: 13px; padding: 4px 8px; }
  .msg.system .bubble.err { color: #E85D3F; background: rgba(232,93,63,0.07);
    border-radius: 10px; padding: 6px 10px; }

  .thinking-indicator { display: flex; gap: 4px; padding: 10px 14px;
    background: #fff; border-radius: 18px; border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); align-self: flex-start; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-sub);
    animation: bounce 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

  /* ── Thinking bar ── */
  #thinking-bar { display: none; padding: 5px 16px;
    font-size: 13px; color: var(--text-sub); background: var(--bg);
    border-top: 1px solid var(--border); flex-shrink: 0; }
  #thinking-bar.visible { display: block; }

  /* ── Input area ── */
  #input-area { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
  #input-row { display: flex; gap: 6px; align-items: flex-end; }
  #tool-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .tool-btn { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--mint2);
    background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer;
    white-space: nowrap; -webkit-tap-highlight-color: transparent; font-family: inherit; }
  .tool-btn:active { background: var(--mint); }
  .random-skip-llm-row { display: flex; align-items: center; gap: 8px; margin-top: 12px;
    padding: 10px 2px; font-size: 14px; color: var(--text); cursor: pointer; user-select: none; }
  .random-skip-llm-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--mint2); cursor: pointer; margin: 0; flex-shrink: 0; }
  #msg-input { flex: 1; border: 1.5px solid var(--mint2); border-radius: 20px;
    padding: 9px 14px; font-size: 15px; color: var(--text); background: var(--bg);
    resize: none; outline: none; max-height: 120px; overflow-y: auto;
    line-height: 1.4; font-family: inherit; }
  #send-btn { width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--mint2); color: var(--text); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
  #send-btn:active { background: var(--mint); }
  #send-btn:disabled { opacity: 0.5; cursor: default; }

  /* ── 圖片附件 ── */
  #attach-btn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--mint2);
    background: var(--bg); color: var(--text); font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; padding: 0; }
  #attach-btn:active { background: var(--mint); }
  #attach-btn:disabled { opacity: 0.4; cursor: default; }
  #attach-preview { display: none; gap: 6px; flex-wrap: wrap; }
  #attach-preview.visible { display: flex; }
  .attach-thumb { position: relative; width: 56px; height: 56px; border-radius: 10px;
    overflow: hidden; border: 1.5px solid var(--mint2); background: var(--bg); flex-shrink: 0; }
  .attach-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attach-thumb button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
    border-radius: 50%; border: none; background: rgba(0,0,0,0.55); color: #fff;
    font-size: 11px; line-height: 1; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; }
  .msg-images { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .msg-images img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px;
    display: block; cursor: pointer; background: rgba(0,0,0,0.05); }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 300;
    display: none; align-items: center; justify-content: center; padding: 16px; }
  #lightbox.visible { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }

  /* ── Bottom sheets (shared) ── */
  .sheet-overlay { display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.25); z-index: 100; align-items: flex-end; }
  .sheet-overlay.visible { display: flex; }
  .sheet { width: 100%; background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
    display: flex; flex-direction: column; max-height: 80dvh; }
  .sheet-header { padding: 16px 16px 0; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0; }
  .sheet-title { font-size: 16px; font-weight: 600; }
  .sheet-close { background: none; border: none; font-size: 20px; cursor: pointer;
    color: var(--text-sub); padding: 0 4px; }
  .sheet-tabs { display: flex; gap: 0; padding: 10px 16px 0; flex-shrink: 0;
    border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .sheet-tabs::-webkit-scrollbar { display: none; }
  .tab-btn { padding: 8px 14px; border: none; background: none; font-size: 14px;
    color: var(--text-sub); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent;
    margin-bottom: -1px; font-family: inherit; -webkit-tap-highlight-color: transparent; }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--mint2); font-weight: 600; }
  .sheet-body { overflow-y: auto; flex: 1; padding: 12px 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom)); }

  .list-item { display: flex; align-items: center; gap: 10px;
    padding: 12px 8px; border-bottom: 1px solid var(--border); cursor: pointer;
    -webkit-tap-highlight-color: transparent; border-radius: var(--radius-sm); }
  .list-item:active { background: var(--mint); }
  .list-item.active-item { background: var(--mint); }
  .list-item-icon { width: 36px; height: 36px; border-radius: 50%;
    background: var(--mint2); display: flex; align-items: center;
    justify-content: center; font-size: 16px; flex-shrink: 0; }
  .list-item-main { flex: 1; min-width: 0; }
  .list-item-title { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .list-item-badge { font-size: 12px; color: var(--text-sub); flex-shrink: 0; }

  .persona-avatar { width: 36px; height: 36px; border-radius: 50%;
    object-fit: cover; background: var(--mint2); flex-shrink: 0; }

  /* ── Random sheet ── */
  .random-section-title { font-size: 12px; color: var(--text-sub); margin: 8px 0 6px; }
  .random-section-title:first-child { margin-top: 0; }
  .random-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .random-btn { padding: 10px 6px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--mint2); background: var(--bg); color: var(--text);
    font-size: 14px; cursor: pointer; text-align: center; font-family: inherit;
    -webkit-tap-highlight-color: transparent; }
  .random-btn:active { background: var(--mint); }
  .random-other { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #dice-custom { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  #dice-custom input { width: 56px; padding: 6px 8px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--mint2); background: var(--bg); color: var(--text);
    font-size: 14px; text-align: center; outline: none; }
  #dice-custom label { font-size: 13px; color: var(--text-sub); }
  #custom-roll-btn { padding: 6px 14px; border-radius: 20px; border: none;
    background: var(--mint2); color: var(--text); font-size: 14px; cursor: pointer;
    font-family: inherit; }

  /* ── Screenshot overlay ── */
  #ss-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    z-index: 300; flex-direction: column; }
  #ss-overlay.visible { display: flex; }
  #ss-viewport { flex: 1; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; }
  #ss-img { max-width: 100%; max-height: 100%; transform-origin: center center;
    touch-action: none; border-radius: 4px; display: block; user-select: none; -webkit-user-drag: none; }
  #ss-toolbar { padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; gap: 8px; flex-shrink: 0; }
  .ss-btn { flex: 1; padding: 11px 0; border-radius: var(--radius-sm); border: none;
    font-size: 14px; cursor: pointer; font-family: inherit; }
  #ss-add-btn { background: var(--mint2); color: var(--text); }
  #ss-refresh-btn { background: rgba(255,255,255,0.18); color: #fff; flex: 0 0 52px; font-size: 18px; }
  #ss-close-btn { background: rgba(255,255,255,0.15); color: #fff; }
  #ss-hint { text-align: center; color: rgba(255,255,255,0.4); font-size: 11px;
    padding: 4px 0 0; flex-shrink: 0; }

  /* ── Screenshot remote control ── */
  #ss-remote-toggle { background: rgba(255,255,255,0.18); color: #fff; }
  #ss-remote-toggle.on  { background: #FF5555; color: #fff; }
  #ss-remote-bar { display: none; flex-direction: column; gap: 6px;
    padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    background: rgba(20,20,20,0.95); flex-shrink: 0; }
  #ss-remote-bar.visible { display: flex; }
  #ss-remote-input-row { display: flex; gap: 6px; align-items: flex-end; }
  #ss-remote-input { flex: 1; border: 1.5px solid rgba(255,255,255,0.25); border-radius: 20px;
    padding: 8px 14px; font-size: 15px; color: #fff; background: rgba(255,255,255,0.1);
    resize: none; outline: none; max-height: 90px; font-family: inherit; line-height: 1.4; }
  #ss-remote-input::placeholder { color: rgba(255,255,255,0.4); }
  #ss-remote-send { width: 38px; height: 38px; border-radius: 50%; border: none;
    background: #FF5555; color: #fff; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #ss-remote-enter-wrap { display: flex; align-items: center; gap: 6px; }
  #ss-remote-enter-check { accent-color: #FF5555; width: 14px; height: 14px; }
  #ss-remote-enter-label { font-size: 12px; color: rgba(255,255,255,0.6); }
  #ss-keys { display: flex; gap: 5px; flex-wrap: wrap; }
  .ss-key { padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); font-size: 12px;
    cursor: pointer; font-family: inherit; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .ss-key:active { background: rgba(255,255,255,0.22); }
  /* 遙控模式游標提示 */
  #ss-img.remote-mode { cursor: crosshair; }
  /* 點擊漣漪（展開消失） */
  #ss-click-ripple { position: absolute; pointer-events: none; width: 44px; height: 44px;
    border-radius: 50%; border: 3px solid rgba(255,60,60,0.9);
    transform: translate(-50%,-50%) scale(0);
    transition: transform 0.3s ease-out, opacity 0.3s ease-out; opacity: 1; z-index: 21; }
  #ss-click-ripple.pop { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
  /* 十字準星（持續顯示在上次點擊位置） */
  #ss-crosshair { position: absolute; pointer-events: none; z-index: 20;
    transform: translate(-50%, -50%); display: none; }
  #ss-crosshair svg { width: 28px; height: 28px; }
  #ss-coord-badge { position: absolute; pointer-events: none; z-index: 22;
    background: rgba(20,20,20,0.82); color: #fff; border-radius: 10px;
    padding: 2px 7px; font-size: 11px; font-family: monospace; white-space: nowrap;
    transform: translate(-50%, calc(-100% - 10px)); display: none; }
  /* 雙指滾動方向提示（固定在視窗中央） */
  #ss-scroll-indicator {
    position: absolute; pointer-events: none; z-index: 25;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20,20,20,0.78); color: #fff;
    border-radius: 20px; padding: 8px 22px;
    font-size: 32px; line-height: 1;
    opacity: 0; transition: opacity 0.15s;
  }
  /* 右鍵模式切換按鈕 */
  #ss-rclick-toggle { border: 1.5px solid; border-radius: 8px; background: none;
    font-size: 12px; cursor: pointer; font-family: inherit; white-space: nowrap;
    padding: 5px 10px; -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s, border-color 0.15s; }
  #ss-rclick-toggle.lft { border-color: rgba(255,100,100,0.45); color: rgba(255,150,150,0.9); }
  #ss-rclick-toggle.lft:active { background: rgba(255,80,80,0.2); }
  #ss-rclick-toggle.rgt { border-color: rgba(80,160,255,0.7); color: rgba(140,200,255,0.95);
    background: rgba(80,160,255,0.15); }
  #ss-rclick-toggle.rgt:active { background: rgba(80,160,255,0.3); }

  /* ── PC programs / system sheet ── */
  .prog-item { display: flex; align-items: center; gap: 10px; padding: 10px 8px;
    border-bottom: 1px solid var(--border); }
  .prog-icon { width: 36px; height: 36px; border-radius: 8px; object-fit: contain;
    flex-shrink: 0; background: var(--mint2); }
  .prog-icon-ph { width: 36px; height: 36px; border-radius: 8px; background: var(--mint2);
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .prog-name { flex: 1; font-size: 14px; }
  .prog-status { font-size: 11px; color: var(--text-sub); }
  .prog-btn { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--mint2);
    background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer;
    font-family: inherit; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
  .prog-btn.stop { border-color: #FF5555; color: #FF5555; }
  .prog-btn:active { background: var(--mint); }
  .sys-btn { display: flex; width: 100%; align-items: center; gap: 12px; padding: 14px 8px;
    border-bottom: 1px solid var(--border); background: none; border-left: none; border-right: none; border-top: none;
    font-size: 15px; color: var(--text); cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent; border-radius: var(--radius-sm); }
  .sys-btn:active { background: var(--mint); }
  .sys-btn.danger { color: #E85D3F; }
  .sys-btn-icon { font-size: 24px; width: 36px; text-align: center; }

  /* ── 裝置暱稱設定 modal ── */
  #device-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    z-index: 600; align-items: center; justify-content: center; padding: 24px; }
  #device-modal-bg.visible { display: flex; }
  #device-modal { width: 100%; max-width: 340px; background: var(--surface);

    transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  #conn-toast.visible { opacity: 1; }

  /* ╔══════════════════════════════════════════════════════════════════╗
     ║ 【個人新聞報】樣式區                                              ║
     ║                                                                  ║
     ║ 本區 .nr-* 樣式 ＋ #reader-overlay 結構 ＋ script 內同名標題的     ║
     ║ 邏輯區塊，構成一組完整且自足的功能，對外只依賴：                    ║
     ║   api() / showToast() / openSheet() / closeSheet() / $msgInput    ║
     ║ 若 mobile.html 日後過大，可整組搬到 assets/mobile-reader.html。    ║
     ║ 修改時請維持這個邊界，不要把新聞報邏輯散進聊天主流程。              ║
     ╚══════════════════════════════════════════════════════════════════╝ */
  #reader-overlay .sheet { max-height: 94dvh; height: 94dvh; }
  #reader-body { padding: 10px 12px; }

  .nr-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px 0; flex-shrink: 0; }
  .nr-optbtn { border: 1.5px solid var(--border); background: var(--bg); color: var(--text);

    cursor: pointer; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
  .nr-optbtn.on { background: var(--mint); border-color: var(--mint2); font-weight: 600; }

  .nr-options { padding: 10px 16px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0; max-height: 46dvh; overflow-y: auto; }
  .nr-opt-head { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; }
  .nr-opt-heading { font-size: 14px; font-weight: 600; color: var(--text); }
  .nr-opt-done { border: none; background: var(--mint2); color: var(--text);

  .nr-opt-title { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
  .nr-opt-note { font-size: 12px; color: var(--text-sub); line-height: 1.6; padding: 4px 0 2px; }
  .nr-ordergroup { font-size: 11px; color: var(--text-sub); background: var(--surface);
    border-radius: 10px; padding: 3px 8px; flex-shrink: 0; }
  .nr-chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .nr-chip { border: 1.5px solid var(--border); background: var(--bg); color: var(--text-sub);
    border-radius: 16px; font-size: 13px; font-family: inherit; padding: 9px 13px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .nr-chip.on { background: var(--mint2); border-color: var(--mint2); color: var(--text); font-weight: 600; }

  .nr-orderrow { display: flex; align-items: center; gap: 8px; padding: 7px 0;
    border-bottom: 1px solid var(--border); }
  .nr-ordername { flex: 1; min-width: 0; font-size: 13px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nr-movebtn { border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 50%; width: 40px; height: 40px; font-size: 14px; cursor: pointer;
    flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  .nr-movebtn:disabled { opacity: 0.3; }

  /* 欄標題（section header）：欄名 + 則數 + 只重抓這一欄 */
  .nr-section { margin: 4px 0 16px; }
  .nr-section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    padding-bottom: 6px; border-bottom: 2px solid var(--mint2); }
  .nr-section-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nr-quota { width: 56px; padding: 8px 4px; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; text-align: center;
    outline: none; font-family: inherit; flex-shrink: 0; }
  .nr-secbtn { border: none; background: var(--mint); color: var(--text); border-radius: 16px;
    font-size: 12px; font-family: inherit; padding: 8px 12px; cursor: pointer; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; }
  .nr-secbtn:disabled { opacity: 0.5; }

  /* 新聞卡片 */
  .nr-card { border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px; margin-bottom: 10px; background: var(--bg); }
  .nr-card.pinned { border-color: var(--mint2); background: var(--mint); }
  .nr-card-title { font-size: 15px; line-height: 1.45; color: var(--text); font-weight: 600; }
  .nr-card-summary { font-size: 13px; line-height: 1.5; color: var(--text-sub); margin-top: 6px; }
  .nr-card-meta { font-size: 11px; color: var(--text-sub); margin-top: 6px; }
  .nr-card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .nr-act { border: 1.5px solid var(--border); background: var(--surface); color: var(--text-sub);
    border-radius: 16px; font-size: 12px; font-family: inherit; padding: 9px 13px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .nr-act:active { background: var(--mint); }
  .nr-act.on { background: var(--mint2); border-color: var(--mint2); color: var(--text); font-weight: 600; }

  .nr-empty { text-align: center; color: var(--text-sub); font-size: 14px;
    padding: 40px 20px; line-height: 1.7; }
  .nr-skeleton { height: 76px; border-radius: var(--radius-sm); margin-bottom: 10px;
    background: var(--border); opacity: 0.5; animation: nr-pulse 1.2s ease-in-out infinite; }
  @keyframes nr-pulse { 0%,100% { opacity: 0.35 } 50% { opacity: 0.6 } }

  #reader-footer { flex-shrink: 0; border-top: 1px solid var(--border);
    padding: 10px 16px max(10px, env(safe-area-inset-bottom)); background: var(--surface);
    display: flex; align-items: center; gap: 10px; }
  #reader-refresh { flex: 1; padding: 12px; border-radius: 20px; border: none;
    background: var(--mint2); color: var(--text); font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #reader-refresh:disabled { opacity: 0.5; }
  #reader-fetched { font-size: 11px; color: var(--text-sub); white-space: nowrap; }
  /* ╚═══ 個人新聞報樣式區結束 ═══╝ */
</style>
</head>

<!-- Toast -->
<div id="conn-toast"></div>

<script>
(function () {
  'use strict';

  window.__mobileToken = window.__mobileToken || new URLSearchParams(location.search).get('token') || '';
  (function () {
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
      init = init || {};
      const headers = new Headers(init.headers || {});
      if (window.__mobileToken) headers.set('X-DesktopST-Token', window.__mobileToken);
      init.headers = headers;
      return originalFetch.call(this, input, init);
    };
  })();

  function tokenQuery() {
    return window.__mobileToken ? '?token=' + encodeURIComponent(window.__mobileToken) : '';
  }

  // ── State ──
  let ws = null, wsRetryCount = 0, wsEverConnected = false;
  let state = { desktopCharacters: [], conversation: null, randomToolsEnabled: true, maxImages: 5, remoteControl: { enabled: false, allowedCapabilities: [] } };
  let allLibraryChars = [];
  let isWaiting = false;
  let currentSsDataUrl = null;
  let menuTab = 'conv';
  let pendingUserMsgEl = null, pendingUserContent = '';
  let ctxMsg = null, ctxEl = null;

  // ── DOM ──
  const $chat         = document.getElementById('chat');
  const $msgInput     = document.getElementById('msg-input');
  const $sendBtn      = document.getElementById('send-btn');
  const $pendingRnd   = null; // removed — tokens now go inline
  const $toolBar      = document.getElementById('tool-bar');
  const $randomOpenBtn = document.getElementById('random-open-btn');
  const $toast        = document.getElementById('conn-toast');
  const $ssOverlay    = document.getElementById('ss-overlay');
  const $ssImg        = document.getElementById('ss-img');
  const $ssViewport   = document.getElementById('ss-viewport');
  const $thinkingBar  = document.getElementById('thinking-bar');

  // ── Theme ──
  const THEMES = {
    mint:     { mint:'#CBFBC4', mint2:'#AAEEDD', bg:'#F7FFFC', surface:'#ffffff', userBubble:'#AAEEFF', text:'#3D5A52', sub:'#7AA898', border:'rgba(0,0,0,0.08)' },
    butter:   { mint:'#FFE8AA', mint2:'#F0D080', bg:'#FFFDF0', surface:'#ffffff', userBubble:'#FFF0CC', text:'#5A4A2A', sub:'#9A8A5A', border:'rgba(0,0,0,0.08)' },
    peach:    { mint:'#FFD6B8', mint2:'#F0C0A0', bg:'#FFF8F4', surface:'#ffffff', userBubble:'#FFE8D8', text:'#5A3A2A', sub:'#9A7A6A', border:'rgba(0,0,0,0.08)' },
    aqua:     { mint:'#B8F4EA', mint2:'#88E8D8', bg:'#F0FFFE', surface:'#ffffff', userBubble:'#AAEEFF', text:'#2A5050', sub:'#6A9A98', border:'rgba(0,0,0,0.08)' },
    sky:      { mint:'#AAEEFF', mint2:'#88CCEE', bg:'#F0FAFF', surface:'#ffffff', userBubble:'#CCF0FF', text:'#2A4A6A', sub:'#6A8AAA', border:'rgba(0,0,0,0.08)' },
    blush:    { mint:'#FFBBBB', mint2:'#F0A0B0', bg:'#FFF5F5', surface:'#ffffff', userBubble:'#FFD8E0', text:'#5A2A3A', sub:'#9A7A88', border:'rgba(0,0,0,0.08)' },
    lavender: { mint:'#F0BBFF', mint2:'#DDA0EE', bg:'#FDF5FF', surface:'#ffffff', userBubble:'#E8D0FF', text:'#4A2A5A', sub:'#8A6A9A', border:'rgba(0,0,0,0.08)' },
    white:    { mint:'#E8E8E8', mint2:'#CCCCCC', bg:'#FFFFFF', surface:'#F8F8F8', userBubble:'#DDDDDD', text:'#3D5A52', sub:'#7BA898', border:'rgba(0,0,0,0.12)' },
    dark:     { mint:'#252525', mint2:'#333333', bg:'#111111', surface:'#1A1A1A', userBubble:'#1E3838', text:'#EEEEEE', sub:'#888888', border:'rgba(255,255,255,0.1)' },
  };
  function applyTheme(name) {
    const t = THEMES[name] || THEMES.mint;
    const s = document.documentElement.style;
    s.setProperty('--mint', t.mint);
    s.setProperty('--mint2', t.mint2);
    s.setProperty('--bg', t.bg);
    s.setProperty('--surface', t.surface);
    s.setProperty('--user-bubble', t.userBubble);
    s.setProperty('--text', t.text);
    s.setProperty('--text-sub', t.sub);
    s.setProperty('--border', t.border);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', t.mint);
  }

  // ── Toast ──
  let toastTimer = null;
  function showToast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('visible');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('visible'), 2500);
  }

  // ── Avatar ──
  function avatarUrl(id) {
    const base = window.__relayDeviceId ? '/' + window.__relayDeviceId : '';
    return base + '/api/avatar/' + encodeURIComponent(id) + tokenQuery();
  }

  function makeImgOrPh(id, cls, onClick) {
    const img = document.createElement('img');
    img.className = cls; img.src = avatarUrl(id);
    if (onClick) img.addEventListener('click', onClick);
    img.onerror = () => {
      const ph = document.createElement('div');
      ph.className = cls + '-ph'; ph.textContent = '🐾';
      if (onClick) ph.addEventListener('click', onClick);
      img.replaceWith(ph);
    };
    return img;
  }

  // ── Header ──
  function renderHeader() {
    const $av = document.getElementById('char-avatars');
    $av.innerHTML = '';
    for (const c of state.desktopCharacters) {
      const wrap = document.createElement('div');
      wrap.className = 'char-avatar-wrap' + (c.muted ? ' muted' : '');
      wrap.title = c.name + (c.muted ? '（禁言中）' : '');
      wrap.addEventListener('click', () => showCharacterMenu(c.id));

      const img = document.createElement('img');
      img.className = 'char-avatar'; img.src = avatarUrl(c.id);
      img.onerror = () => {
        const ph = document.createElement('div');
        ph.className = 'char-avatar-ph'; ph.textContent = '🐾';
        img.replaceWith(ph);
      };
      wrap.appendChild(img);
      $av.appendChild(wrap);
    }
  }

  // ── Chat rendering ──
  // Mirrors desktop: getToolEmoji(r.tool) + ' ' + formatResultBadgeText(r)
  function getToolEmoji(tool) {
    if (tool === 'omikuji') return '🏮';
    if (tool === 'jiao')    return '🙏';
    if (tool === 'coin')    return '🪙';
    if (tool === 'dice')    return '🎲';
    return '';
  }
  function modStr(mod) {
    return mod > 0 ? '+' + mod : mod < 0 ? String(mod) : '';
  }
  function formatResultBadgeText(r) {
    if (!r) return '';
    if (r.tool === 'coin')    return r.result;
    if (r.tool === 'jiao')    return r.result;
    if (r.tool === 'omikuji') return r.result;
    if (r.tool === 'dice') {
      const kept = r.kept ?? r.rolls;
      const hasKeep = kept.length < r.count;
      const mod = modStr(r.modifier);
      if (hasKeep) {
        return r.total + '（骰：' + r.rolls.join(', ') + '，取：' + kept.join('+') + mod + '）';
      }
      const parts = (kept.length > 1 || r.modifier !== 0)
        ? '（' + kept.join('+') + mod + '）'
        : '';
      return r.total + parts;
    }
    return '';
  }
  function formatRandom(r) {
    if (!r) return '';
    return getToolEmoji(r.tool) + ' ' + formatResultBadgeText(r);
  }

  // Pending bar label: shows what was rolled but hides the result until sent
  function formatRandomPending(r) {
    if (!r) return '';
    if (r.tool === 'coin')    return '🪙 硬幣已擲（送出後揭曉）';
    if (r.tool === 'jiao')    return '🙏 擲茭已擲（送出後揭曉）';
    if (r.tool === 'omikuji') return '🏮 抽籤已抽（送出後揭曉）';
    if (r.tool === 'dice') {
      const kh = r.keepHighest != null ? 'kh'+r.keepHighest : '';
      const kl = r.keepLowest  != null ? 'kl'+r.keepLowest  : '';
      const mod = r.modifier > 0 ? '+'+r.modifier : r.modifier < 0 ? String(r.modifier) : '';
      return '🎲 ' + r.count + 'd' + r.faces + kh + kl + mod + '（送出後揭曉）';
    }
    return '';
  }

  // Short label for pending tag (compact, no "送出後揭曉")
  function formatRandomPendingShort(r) {
    if (!r) return '';
    if (r.tool === 'coin')    return '🪙 硬幣';
    if (r.tool === 'jiao')    return '🙏 擲茭';
    if (r.tool === 'omikuji') return '🏮 抽籤';
    if (r.tool === 'dice') {
      const kh = r.keepHighest != null ? 'kh'+r.keepHighest : '';
      const kl = r.keepLowest  != null ? 'kl'+r.keepLowest  : '';
      const mod = r.modifier > 0 ? '+'+r.modifier : r.modifier < 0 ? String(r.modifier) : '';
      return '🎲 ' + r.count + 'd' + r.faces + kh + kl + mod;
    }
    return '';
  }

  function renderPendingTags() { /* no-op: tokens are now inline in textarea */ }

  // ── Inline token system (mirrors desktop randomTools.ts) ──

  // Generate token string to insert (e.g. [🏮抽籤], [🎲2d6+3])
  function makeTokenString(tool, params) {
    if (tool === 'omikuji') return '[🏮抽籤]';
    if (tool === 'jiao')    return '[🙏擲茭]';
    if (tool === 'coin')    return '[🪙硬幣]';
    if (tool === 'dice') {
      const count = params.count ?? 1;
      const faces = params.faces ?? 6;
      const mod   = params.modifier ?? 0;
      const modS  = mod > 0 ? '+'+mod : mod < 0 ? String(mod) : '';
      const kh    = params.keepHighest != null ? 'kh'+params.keepHighest : '';
      const kl    = params.keepLowest  != null ? 'kl'+params.keepLowest  : '';
      return '[🎲'+count+'d'+faces+kh+kl+modS+']';
    }
    return '';
  }

  // Insert token at textarea cursor position
  function insertToken(token) {
    const el = $msgInput;
    const start = el.selectionStart ?? el.value.length;
    const end   = el.selectionEnd   ?? el.value.length;
    const before = el.value.slice(0, start);
    const after  = el.value.slice(end);
    const sep = (before.length > 0 && !before.endsWith(' ')) ? ' ' : '';
    el.value = before + sep + token + ' ' + after;
    const pos = start + sep.length + token.length + 1;
    el.focus();
    el.setSelectionRange(pos, pos);
    resizeTA();
  }

  // Token regex — supports emoji-prefixed and plain tokens
  function tokenRegex() {
    return /\[(?:\u{1F3EE}抽籤|\u{1F64F}擲茭|\u{1FA99}硬幣|\u{1F3B2}\d+d\d+(?:kh\d+|kl\d+)?(?:[+-]\d+)?|抽籤|擲茭|硬幣|\d+d\d+(?:kh\d+|kl\d+)?(?:[+-]\d+)?)\]/gu;
  }

  // Compute a random result client-side (no server call needed)
  //
  // ⚠️ 這是 src/core/random/dice.ts 的**第三份實作**，蓄意保留：
  //    本檔是純 vanilla HTML，沒有建置步驟，無法 import TypeScript。
  //    依 roadmap §4.5，本檔會在 B6 由「手機 UI 的 web build」整份取代，
  //    屆時這段自然消失。**在那之前，改 core 的機率表要記得同步這裡。**
  //    2026-08-04 已與 core 對齊（原本擲筊是 50/25/25，與桌面版不同）。
  function computeRandomResult(tool, params) {
    if (tool === 'coin') {
      return { tool: 'coin', result: Math.random() < 0.5 ? '正面' : '反面' };
    }
    if (tool === 'omikuji') {
      const tiers = [['大吉',12],['中吉',18],['小吉',20],['吉',22],['末吉',15],['凶',10],['大凶',3]];
      const total = tiers.reduce((s,[,w]) => s+w, 0);
      let r = Math.random() * total;
      for (const [t,w] of tiers) { r -= w; if (r <= 0) return { tool: 'omikuji', result: t }; }
      return { tool: 'omikuji', result: '吉' };
    }
    if (tool === 'jiao') {
      const tiers = [['聖筊',40],['笑筊',30],['陰筊',30]];
      const total = tiers.reduce((s,[,w]) => s+w, 0);
      let r = Math.random() * total;
      for (const [t,w] of tiers) { r -= w; if (r <= 0) return { tool: 'jiao', result: t }; }
      return { tool: 'jiao', result: '聖筊' };
    }
    if (tool === 'dice') {
      const faces    = Math.max(2, params.faces ?? 6);
      const count    = Math.max(1, Math.min(20, params.count ?? 1));
      const modifier = params.modifier ?? 0;
      const kh = params.keepHighest != null ? Math.max(1, params.keepHighest) : undefined;
      const kl = params.keepLowest  != null ? Math.max(1, params.keepLowest)  : undefined;
      const rolls = Array.from({length: count}, () => Math.floor(Math.random() * faces) + 1);
      let kept;
      if (kh != null) kept = [...rolls].sort((a,b)=>b-a).slice(0, Math.min(kh, count));
      else if (kl != null) kept = [...rolls].sort((a,b)=>a-b).slice(0, Math.min(kl, count));
      else kept = [...rolls];
      const total = kept.reduce((a,b)=>a+b, 0) + modifier;
      return { tool: 'dice', faces, count, rolls, kept, keepHighest: kh, keepLowest: kl, modifier, total };
    }
    return null;
  }

  // Parse a single token string into {tool, params}
  function parseToken(token) {
    const inner = token.slice(1, -1);
    const stripped = inner.replace(/^[\u{1F3EE}\u{1F64F}\u{1FA99}\u{1F3B2}]/u, '');
    if (stripped === '抽籤') return { tool: 'omikuji', params: {} };
    if (stripped === '擲茭') return { tool: 'jiao',    params: {} };
    if (stripped === '硬幣') return { tool: 'coin',    params: {} };
    const m = stripped.match(/^(\d+)d(\d+)(?:(kh|kl)(\d+))?([+-]\d+)?$/);
    if (!m) return null;
    const params = { count: parseInt(m[1],10), faces: parseInt(m[2],10), modifier: m[5] ? parseInt(m[5],10) : 0 };
    if (m[3] === 'kh') params.keepHighest = parseInt(m[4], 10);
    if (m[3] === 'kl') params.keepLowest  = parseInt(m[4], 10);
    return { tool: 'dice', params };
  }

  // Format result inline (same as desktop formatResultInline)
  function formatResultInline(r) {
    if (r.tool === 'omikuji') return '｛🏮抽籤結果：' + r.result + '｝';
    if (r.tool === 'jiao')    return '｛🙏擲茭結果：' + r.result + '｝';
    if (r.tool === 'coin')    return '｛🪙硬幣結果：' + r.result + '｝';
    if (r.tool === 'dice') {
      const kept = r.kept ?? r.rolls;
      const hasKeep = kept.length < r.count;
      const mod = modStr(r.modifier);
      const khkl = r.keepHighest != null ? 'kh'+r.keepHighest : r.keepLowest != null ? 'kl'+r.keepLowest : '';
      const notation = r.count + 'd' + r.faces + khkl + mod;
      if (hasKeep) return '｛🎲骰子'+notation+'結果：'+r.total+'（骰出：'+r.rolls.join(', ')+'，採計：'+kept.join('+')+mod+'）｝';
      if (r.count === 1 && r.modifier === 0) return '｛🎲骰子'+notation+'結果：'+r.total+'｝';
      return '｛🎲骰子'+notation+'結果：'+r.total+'（'+kept.join('+')+mod+'='+r.total+'）｝';
    }
    return '';
  }

  // Expand all tokens in text → { expandedText, results[] }
  function expandRandomTokens(text) {
    const results = [];
    const expandedText = text.replace(tokenRegex(), (match) => {
      const parsed = parseToken(match);
      if (!parsed) return match;
      const result = computeRandomResult(parsed.tool, parsed.params);
      if (!result) return match;
      results.push(result);
      return formatResultInline(result);
    });
    return { expandedText, results };
  }

  function hasRandomTokens(text) { return tokenRegex().test(text); }

  function charName(id) {
    return (state.desktopCharacters.find(x=>x.id===id) || allLibraryChars.find(x=>x.id===id))?.name || '角色';
  }

  function renderMsg(msg) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + msg.role;
    wrap.dataset.msgId = msg.id;

    if (msg.role === 'system') {
      const b = document.createElement('div');
      b.className = msg.content?.startsWith('⚠️') ? 'bubble err' : 'bubble';
      b.textContent = msg.content; wrap.appendChild(b); return wrap;
    }

    let avatarEl = null;
    if (msg.role === 'character' && msg.characterId) {
      avatarEl = makeImgOrPh(msg.characterId, 'msg-avatar', () => showCharacterMenu(msg.characterId));
    }
    // user: no avatar

    const col = document.createElement('div'); col.className = 'msg-col';
    if (msg.role === 'character' && msg.characterId) {
      const nm = document.createElement('div'); nm.className = 'char-name';
      nm.textContent = charName(msg.characterId); col.appendChild(nm);
    }

    // Bubble + menu button container
    const bubbleRow = document.createElement('div');
    bubbleRow.style.cssText = 'display: flex; align-items: flex-end; gap: 4px;';

    const bubble = document.createElement('div'); bubble.className = 'bubble';
    // 圖片：樂觀渲染用本地 data URL，已存檔的訊息用 /api/message-image 按需取
    const imgSrcs = msg.localImages && msg.localImages.length
      ? msg.localImages
      : Array.from({ length: msg.imageCount || 0 }, (_, i) => messageImageUrl(msg.id, i));
    if (imgSrcs.length) {
      const strip = document.createElement('div'); strip.className = 'msg-images';
      for (const src of imgSrcs) {
        const im = document.createElement('img');
        im.src = src; im.loading = 'lazy'; im.alt = '附件圖片';
        im.addEventListener('click', () => openLightbox(src));
        im.onerror = () => im.remove();   // 換過對話後舊圖抓不到，就別留破圖

        strip.appendChild(im);
      }
      bubble.appendChild(strip);
    }
    if (msg.randomResults && msg.randomResults.length) {
      for (const r of msg.randomResults) {
        const badge = document.createElement('div');
        badge.style.cssText = 'font-size:13px;color:var(--text-sub);margin-bottom:4px;';
        badge.textContent = formatRandom(r); bubble.appendChild(badge);
      }
    } else if (msg.randomResult) {
      const badge = document.createElement('div');
      badge.style.cssText = 'font-size:13px;color:var(--text-sub);margin-bottom:4px;';
      badge.textContent = formatRandom(msg.randomResult); bubble.appendChild(badge);
    }
    bubble.appendChild(document.createTextNode(msg.content ?? ''));
    bubbleRow.appendChild(bubble);

    // Add menu button for non-pending messages
    if (!msg.id.startsWith('pending-')) {
      const menuBtn = document.createElement('button');
      menuBtn.className = 'msg-menu-btn';
      menuBtn.textContent = '…';
      menuBtn.style.cssText = 'flex-shrink: 0; background: none; border: none; color: rgba(0,0,0,0.2); font-size: 18px; cursor: pointer; padding: 0 2px; -webkit-tap-highlight-color: transparent; line-height: 1;';
      menuBtn.addEventListener('click', () => showMsgMenu(msg, wrap));
      bubbleRow.appendChild(menuBtn);
    }

    col.appendChild(bubbleRow);
    if (avatarEl) wrap.appendChild(avatarEl);
    wrap.appendChild(col);
    return wrap;
  }

  function renderAll() {
    const wasThinking = $thinkingBar.classList.contains('visible');
    $chat.innerHTML = '';
    for (const msg of (state.conversation?.messages ?? [])) $chat.appendChild(renderMsg(msg));
    if (wasThinking) showThinking();   // 重繪不該吃掉還在進行中的思考動畫
    scrollBottom();
  }

  // 思考狀態逾時保險：LLM 失敗時不會有訊息推回來，沒有逾時的話提示會永遠卡著
  var thinkingTimer = null;
  const THINKING_TIMEOUT_MS = 90000;

  function showThinkingBar(charId) {
    const name = charId ? charName(charId) : null;
    $thinkingBar.textContent = (name ? name + ' ' : '') + '正在回覆…';
    $thinkingBar.classList.add('visible');
    if (thinkingTimer) clearTimeout(thinkingTimer);
    thinkingTimer = setTimeout(() => { removeThinking(); hideThinkingBar(); fetchState(); }, THINKING_TIMEOUT_MS);
  }
  function hideThinkingBar() {
    if (thinkingTimer) { clearTimeout(thinkingTimer); thinkingTimer = null; }
    $thinkingBar.classList.remove('visible');
  }

  function appendMsg(msg) {
    removeThinking();
    hideThinkingBar();
    $chat.appendChild(renderMsg(msg));
    scrollBottom();
  }

  function scrollBottom() { $chat.scrollTop = $chat.scrollHeight; }

  function showThinking() {
    removeThinking();
    const el = document.createElement('div');
    el.id = 'thinking-el'; el.className = 'thinking-indicator';
    el.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    $chat.appendChild(el); scrollBottom();
  }
  function removeThinking() { document.getElementById('thinking-el')?.remove(); }

  // ── WebSocket ──
  var wsFailCount = 0;
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    // 優先用 Worker 注入的 tunnel WebSocket URL，否則連本機
    const wsUrl = window.__tunnelWsUrl || (proto + '//' + location.host + tokenQuery());
    ws = new WebSocket(wsUrl);
    ws.addEventListener('open', () => {
      wsRetryCount = 0; wsFailCount = 0;
      // 重連後必須對帳：手機鎖屏／切背景時 WS 會被系統斷掉，
      // 斷線期間 push 的訊息（例如遠端叫角色「說點什麼」的回覆）不會補送，
      // 不重抓的話畫面會一直停在舊狀態。
      if (wsEverConnected) { showToast('已重新連線'); fetchState(); }
      else { wsEverConnected = true; showToast('已連線'); }
    });
    ws.addEventListener('message', e => {
      let d; try { d = JSON.parse(e.data); } catch { return; }
      if (d.type === 'message' && d.message) {
        state.conversation?.messages.push(d.message);
        // If this is the echo of our optimistic user message, just update its ID
        if (d.message.role === 'user' && pendingUserMsgEl && d.message.content === pendingUserContent) {
          pendingUserMsgEl.dataset.msgId = d.message.id;
          pendingUserMsgEl = null; pendingUserContent = '';
        } else {
          appendMsg(d.message);
        }
      } else if (d.type === 'thinking') {
        showThinking();
        showThinkingBar(d.characterId);
      } else if (d.type === 'thinking-done') {
        removeThinking();
        hideThinkingBar();
      } else if (d.type === 'desktop-updated' && d.desktopCharacterIds) {
        fetchState();
      } else if (d.type === 'remote-control-state' && d.remoteControl) {
        if (typeof d.randomToolsEnabled === 'boolean') {
          state.randomToolsEnabled = d.randomToolsEnabled;
          updateRandomToolsUi();
        }
        fetchState();
      } else if (d.type === 'reminder') {
        showToast('📌 ' + (d.content || '收到提醒'));
      }
    });
    ws.addEventListener('close', () => {
      ws = null;
      wsFailCount++;
      // 重試 4 次都失敗，且是透過 relay 連線 → 回 relay 重載頁面取得新 tunnel URL
      if (wsFailCount >= 4 && window.__relayPageUrl) {
        showToast('重新取得連線資訊…');
        setTimeout(() => { window.location.href = window.__relayPageUrl; }, 1000);
        return;
      }
      const delay = Math.min(500 * Math.pow(2, wsRetryCount), 8000);
      wsRetryCount++;
      showToast('連線中斷，重連中…');
      setTimeout(connectWS, delay);
    });
    ws.addEventListener('error', () => ws?.close());
  }

  // ── 圖片附件 ──
  // 手機相機動輒 4000px / 好幾 MB，直接送 base64 會塞爆 body，先在前端縮圖再壓 JPEG
  const IMG_MAX_EDGE = 1024;
  const IMG_QUALITY  = 0.8;

  let pendingImages = [];   // data URL 陣列，送出後清空
  const $attachBtn     = document.getElementById('attach-btn');
  const $attachInput   = document.getElementById('attach-input');
  const $attachPreview = document.getElementById('attach-preview');
  const $lightbox      = document.getElementById('lightbox');
  const $lightboxImg   = document.getElementById('lightbox-img');

  function maxImages() { return state.maxImages || 5; }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, IMG_MAX_EDGE / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        // JPEG 沒有透明通道，先鋪白底免得透明處變黑
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', IMG_QUALITY));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
      img.src = url;
    });
  }

  function renderAttachPreview() {
    $attachPreview.innerHTML = '';
    $attachPreview.classList.toggle('visible', pendingImages.length > 0);
    pendingImages.forEach((dataUrl, i) => {
      const box = document.createElement('div'); box.className = 'attach-thumb';
      const img = document.createElement('img'); img.src = dataUrl;
      img.addEventListener('click', () => openLightbox(dataUrl));
      const rm = document.createElement('button'); rm.textContent = '✕';
      rm.addEventListener('click', () => { pendingImages.splice(i, 1); renderAttachPreview(); });
      box.appendChild(img); box.appendChild(rm);
      $attachPreview.appendChild(box);
    });
    $attachBtn.disabled = pendingImages.length >= maxImages();
  }

  $attachBtn.addEventListener('click', () => { $attachInput.value = ''; $attachInput.click(); });
  $attachInput.addEventListener('change', async () => {
    const files = Array.from($attachInput.files || []);
    if (!files.length) return;
    const room = maxImages() - pendingImages.length;
    if (room <= 0) { showToast('最多只能附 ' + maxImages() + ' 張圖片'); return; }
    if (files.length > room) showToast('最多只能附 ' + maxImages() + ' 張，只加入前 ' + room + ' 張');
    $attachBtn.disabled = true;
    for (const file of files.slice(0, room)) {
      try { pendingImages.push(await compressImage(file)); }
      catch { showToast('無法讀取圖片：' + file.name); }
    }
    renderAttachPreview();
  });

  // ── Send ──
  const $skipLlmChk = document.getElementById('skip-llm-chk');

  async function sendMessage() {
    const raw = $msgInput.value.trim();
    if ((!raw && !pendingImages.length) || isWaiting) return;
    isWaiting = true; $sendBtn.disabled = true;
    const sentImages = pendingImages;
    pendingImages = []; renderAttachPreview();
    $msgInput.value = ''; resizeTA();

    // Expand inline tokens client-side (mirrors desktop expandRandomTokens)
    let finalContent = raw;
    let randomResults;
    if (hasRandomTokens(raw)) {
      const expanded = expandRandomTokens(raw);
      finalContent = expanded.expandedText;
      if (expanded.results.length) randomResults = expanded.results;
    }

    const skipLlm = !$skipLlmChk.checked;
    const payload = { content: finalContent, skipLlm: skipLlm || undefined };
    if (sentImages.length) payload.images = sentImages;
    if (randomResults) {
      payload.randomResults = randomResults;
      payload.randomResult  = randomResults[0]; // legacy compat
    }

    // Optimistic render — show the expanded text immediately
    pendingUserContent = finalContent;
    pendingUserMsgEl = renderMsg({ id: 'pending-' + Date.now(), role: 'user', content: finalContent, randomResults, localImages: sentImages, timestamp: Date.now() });
    $chat.appendChild(pendingUserMsgEl);
    scrollBottom();
    if (!skipLlm) showThinking();
    try {
      const result = await api('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (result?.error) {
        appendMsg({ id: 'err-' + Date.now(), role: 'system', content: '⚠️ ' + result.error, timestamp: Date.now() });
        pendingUserMsgEl = null; pendingUserContent = '';
        // 送失敗就把圖放回附件列，使用者不用重選一次
        if (sentImages.length && !pendingImages.length) { pendingImages = sentImages; renderAttachPreview(); }
      }
    } finally { isWaiting = false; $sendBtn.disabled = false; }
  }

  function resendMsg() {
    if (!ctxMsg || !ctxEl) return;
    // Remove this message and all subsequent from DOM
    let el = ctxEl;
    while (el) { const next = el.nextElementSibling; el.remove(); el = next; }
    removeThinking(); hideThinkingBar();
    // Clear from local state
    if (state.conversation) {
      const idx = state.conversation.messages.findIndex(m => m.id === ctxMsg.id);
      if (idx !== -1) state.conversation.messages.splice(idx);
    }
    api('/api/messages/resend', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: ctxMsg.id }) })
      .then(r => { if (r?.error) appendMsg({ id: 'err-'+Date.now(), role: 'system', content: '⚠️ 重新發送失敗：' + r.error, timestamp: Date.now() }); })

  // ── Screenshots ──
  let ssScale = 1, ssTx = 0, ssTy = 0;
  let ssInitDist = 0, ssBaseScale = 1, ssBaseTx = 0, ssBaseTy = 0;
  let ssPanStartX = 0, ssPanStartY = 0, ssIsPinching = false, ssLastTap = 0;
  let ssGestureMoved = false; // 本次觸控序列是否發生過 pan 或 pinch

  // 雙指滾動狀態（遙控模式下使用）
  let ssScrollMidX = 0, ssScrollMidY = 0;
  let ssScrollAccX = 0, ssScrollAccY = 0;
  let ssScrollLastTime = 0;
  let ssScrollTarget = null; // 滾動中心對應的桌面物理座標
  let ssScrollIndicatorTimer = null;
  let ssRightClickMode = false; // 右鍵點擊模式

  // 執行遙控操作後自動重新截圖的輔助函式
  function autoRefreshAfter(delayMs) {
    if (lastSsRefresh) setTimeout(async () => { try { await lastSsRefresh(); } catch {} }, delayMs);
  }

  function ssDist(t1, t2) { return Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY); }

  function clampSSPan() {
    // scale = 1 時不允許 pan;scale > 1 時 pan 範圍 = (放大後超出視口的半邊)
    if (ssScale <= 1.0001) { ssTx = 0; ssTy = 0; return; }
    const w = $ssImg.offsetWidth, h = $ssImg.offsetHeight;
    const maxX = Math.max(0, (w * ssScale - w) / 2);
    const maxY = Math.max(0, (h * ssScale - h) / 2);
    ssTx = Math.max(-maxX, Math.min(maxX, ssTx));
    ssTy = Math.max(-maxY, Math.min(maxY, ssTy));
  }

  let ssRasterTimer = null;
  function applySSTransform(animate) {
    clampSSPan();
    // 互動／動畫期間提升為合成層 → 拖曳縮放流暢
    $ssImg.style.willChange = 'transform';
    $ssImg.style.transition = animate ? 'transform 0.2s ease' : 'none';
    $ssImg.style.transform = 'translate(' + ssTx + 'px,' + ssTy + 'px) scale(' + ssScale + ')';
    // 互動結束後移除 will-change，讓瀏覽器以當前縮放重新光柵化 → 放大後變清晰
    if (ssRasterTimer) clearTimeout(ssRasterTimer);
    ssRasterTimer = setTimeout(() => { $ssImg.style.willChange = 'auto'; }, animate ? 260 : 180);
  }

  let lastSsRefresh = null;   // 上次截圖的重新整理 function（遙控後呼叫）

  // 把圖片資料套入截圖 overlay（不重置縮放/pan）
  async function applySsBlob(blob, boundsHeader) {
    currentSsBounds = boundsHeader ? JSON.parse(boundsHeader) : null;
    if (currentSsDataUrl) URL.revokeObjectURL(currentSsDataUrl);
    currentSsDataUrl = URL.createObjectURL(blob);

      currentSsBounds = r.headers.get('X-Display-Bounds') ? JSON.parse(r.headers.get('X-Display-Bounds')) : null;
      const blob = await r.blob();
      if (currentSsDataUrl) URL.revokeObjectURL(currentSsDataUrl);
      currentSsDataUrl = URL.createObjectURL(blob);
      ssScale = 1; ssTx = 0; ssTy = 0;
      applySSTransform(false);
      $ssImg.src = currentSsDataUrl;

        const minTag = w.minimized ? ' · 已最小化' : '';

            const blob = await r.blob();
            if (currentSsDataUrl) URL.revokeObjectURL(currentSsDataUrl);
            currentSsDataUrl = URL.createObjectURL(blob);
            ssScale = 1; ssTx = 0; ssTy = 0;
            applySSTransform(false);
            $ssImg.src = currentSsDataUrl;

  document.getElementById('ss-refresh-btn').addEventListener('click', async () => {

  // Pinch-zoom + pan on screenshot（遙控模式下雙指改為滾動）
  // 掛在 $ssViewport 而非 $ssImg，手指滑出圖片邊緣也不中斷
  $ssViewport.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      ssGestureMoved = true;
      if (ssRemoteMode) {
        ssIsPinching = false;
        ssScrollMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        ssScrollMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        ssScrollAccX = 0; ssScrollAccY = 0; ssScrollLastTime = 0;
        const rect = $ssViewport.getBoundingClientRect();
        ssScrollTarget = ssToScreenCoords(ssScrollMidX - rect.left, ssScrollMidY - rect.top);
      } else {
        ssIsPinching = true;
        ssInitDist = ssDist(e.touches[0], e.touches[1]);
        ssBaseScale = ssScale; ssBaseTx = ssTx; ssBaseTy = ssTy;
      }
    } else if (e.touches.length === 1) {
      ssIsPinching = false;
      ssGestureMoved = false;
      ssPanStartX = e.touches[0].clientX - ssTx;
      ssPanStartY = e.touches[0].clientY - ssTy;
    }
  }, { passive: true });

  $ssViewport.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 2) {
      ssGestureMoved = true;
      if (ssRemoteMode) {
        // 遙控模式：雙指滾動
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const dx = midX - ssScrollMidX;
        const dy = midY - ssScrollMidY;
        ssScrollMidX = midX; ssScrollMidY = midY;
        if (Math.abs(dy) > 0.3 || Math.abs(dx) > 0.3) showScrollIndicator(dy, dx);
        // 正規化：以螢幕高度 12 等分為一格滾輪，讓短距離滑動也靈敏
        const vpH = $ssViewport.offsetHeight || 400;
        const vpW = $ssViewport.offsetWidth  || 400;
        ssScrollAccX += dx / (vpW / 10);
        ssScrollAccY += dy / (vpH / 10);
        const now = Date.now();
        if ((Math.abs(ssScrollAccX) >= 0.15 || Math.abs(ssScrollAccY) >= 0.15) && now - ssScrollLastTime > 40) {
          if (ssScrollTarget) {
            const sx = ssScrollAccX, sy = ssScrollAccY;
            ssScrollAccX = 0; ssScrollAccY = 0;
            ssScrollLastTime = now;
            rcFetch('/api/remote/scroll', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              remoteCapability: 'remote.pointer.scroll',
              body: JSON.stringify({ x: ssScrollTarget.x, y: ssScrollTarget.y, deltaX: sx, deltaY: sy })
            }).catch(() => {});
          }
        }
      } else {
        ssIsPinching = true;
        ssScale = Math.max(1.0, Math.min(8, ssBaseScale * ssDist(e.touches[0], e.touches[1]) / ssInitDist));
        applySSTransform(false);
      }
    } else if (e.touches.length === 1 && !ssIsPinching) {
      const dx = e.touches[0].clientX - ssPanStartX - ssTx;
      const dy = e.touches[0].clientY - ssPanStartY - ssTy;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) ssGestureMoved = true;
      if (!ssRemoteMode) {
        ssTx = e.touches[0].clientX - ssPanStartX;
        ssTy = e.touches[0].clientY - ssPanStartY;
        applySSTransform(false);
      }
    }
  }, { passive: false });

  $ssViewport.addEventListener('touchend', e => {
    // 雙指→單指：重設剩餘手指的 pan 基準
    if (e.touches.length === 1 && ssIsPinching) {
      ssPanStartX = e.touches[0].clientX - ssTx;
      ssPanStartY = e.touches[0].clientY - ssTy;
      return;
    }
    // 遙控模式雙指滾動結束：送出剩餘累積量並隱藏提示 + 自動截圖
    if (ssRemoteMode && e.touches.length === 0 && (Math.abs(ssScrollAccX) > 0.05 || Math.abs(ssScrollAccY) > 0.05)) {
      hideScrollIndicator();
      if (ssScrollTarget) {
        const sx = ssScrollAccX, sy = ssScrollAccY;
        ssScrollAccX = 0; ssScrollAccY = 0;
        rcFetch('/api/remote/scroll', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          remoteCapability: 'remote.pointer.scroll',
          body: JSON.stringify({ x: ssScrollTarget.x, y: ssScrollTarget.y, deltaX: sx, deltaY: sy })
        }).then(() => autoRefreshAfter(400)).catch(() => {});
      }
      ssScrollTarget = null;
      return;
    }
    if (e.touches.length === 0) {
      ssIsPinching = false; ssScrollTarget = null;
      hideScrollIndicator();
    }

    const now = Date.now();

    // ── 遙控模式：純點擊 → 送出點擊指令 ──
    if (ssRemoteMode && e.touches.length === 0 && !ssGestureMoved && !ssIsPinching) {
      const touch = e.changedTouches[0];
      if (touch) {
        const rect = $ssViewport.getBoundingClientRect();
        const tx = touch.clientX - rect.left, ty = touch.clientY - rect.top;
        const coords = ssToScreenCoords(tx, ty);
        if (coords) {
          const isDouble = now - ssLastTap < 300;
          const btn = ssRightClickMode ? 'right' : 'left';
          const rippleColor = ssRightClickMode ? 'rgba(80,160,255,0.9)' : 'rgba(255,60,60,0.9)';
          $ssRipple.style.borderColor = rippleColor;
          showRipple(tx, ty);
          showClickMarker(tx, ty, coords);
          const label = ssRightClickMode ? '右鍵' : (isDouble ? '雙擊' : '點擊');
          showToast(`${label} (${coords.x}, ${coords.y})`);
          rcFetch('/api/remote/click', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            remoteCapability: 'remote.pointer.click',
            body: JSON.stringify({ x: coords.x, y: coords.y, button: btn, double: isDouble && !ssRightClickMode })
          }).then(() => autoRefreshAfter(500)).catch(() => {});
          ssLastTap = isDouble ? 0 : now;
        } else {
          showToast('點在截圖範圍外');
        }
      }
      return;
    }

    // Double-tap zoom（非遙控模式）
    if (e.touches.length === 0 && !ssGestureMoved && now - ssLastTap < 280) {
      ssScale = ssScale > 1.2 ? 1 : 2;
      ssTx = 0; ssTy = 0;
      applySSTransform(true);
      ssLastTap = 0;
      return;
    }
    if (!ssGestureMoved && e.touches.length === 0) ssLastTap = now;
  });

  function getDeviceId() {
    let id = localStorage.getItem('dest_device_id');
    if (!id) {
      id = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);

  // 遙控請求專用 fetch：自動附帶裝置識別 header
  // X-Device-Nickname 以 encodeURIComponent 編碼，確保 HTTP header 只含 ASCII，
  // 避免 Safari/iPadOS 對非 ASCII header 值拋出 TypeError 導致功能偵測失敗。
  async function rcFetch(url, opts) {
    opts = opts || {};
    const remoteCapability = opts.remoteCapability;
    const remoteDetail = opts.remoteDetail;
    const remoteConfirmed = opts.remoteConfirmed === true;
    delete opts.remoteCapability;
    delete opts.remoteDetail;
    delete opts.remoteConfirmed;
    const headers = new Headers(opts.headers || {});
    headers.set('X-Device-Id', getDeviceId());
    const nick = getDeviceNickname() || '';
    headers.set('X-Device-Nickname', nick ? encodeURIComponent(nick) : 'unnamed');
    if (remoteCapability && remoteNeedsConfirmation(remoteCapability)) {
      if (!remoteConfirmed && !confirmRemoteCapability(remoteCapability, remoteDetail)) {
        throw new Error('Remote action cancelled');
      }
      headers.set('X-Remote-Confirmed', '1');
    } else if (remoteConfirmed) {
      headers.set('X-Remote-Confirmed', '1');
    }
    opts.headers = headers;
    return fetch(url, opts);
  }

  function remoteHas(cap) {
    return !!state.remoteControl?.allowedCapabilities?.includes(cap);
  }

  function remoteNeedsConfirmation(cap) {
    return !!state.remoteControl?.requireConfirmation?.includes(cap);
  }

  function confirmRemoteCapability(cap, detail) {
    const labels = {
      'remote.pointer.click': 'mouse click',
      'remote.pointer.scroll': 'mouse scroll',
      'remote.keyboard.type': 'keyboard input',
      'remote.keyboard.hotkey': 'hotkey',
      'remote.program.launch': 'launch program',
      'remote.program.close': 'close program',
      'remote.monitor.power': 'screen power',
      'remote.system.shutdown': 'shutdown',
      'remote.system.restart': 'restart'
    };
    const label = labels[cap] || cap;
    return confirm(`Confirm remote ${label}${detail ? `: ${detail}` : ''}?`);
  }

  function remoteHasAny(caps) {
    return caps.some(remoteHas);
  }

  function updateRemoteControlUi() {
    const remote = state.remoteControl || { enabled: false, allowedCapabilities: [] };
    const deviceAllowed = remote.currentDeviceAllowed !== false;

    const monitorAvailable = remoteHas('remote.monitor.power');
    const programAvailable = remoteHasAny(['remote.program.launch', 'remote.program.close']);
    const systemAvailable = remoteHasAny(['remote.system.shutdown', 'remote.system.restart']);
    const remoteMenuAvailable = moduleKnown && deviceAllowed;
    rcEnabled = !!remote.enabled && deviceAllowed && inputAvailable;
    rcSystemEnabled = !!remote.enabled && deviceAllowed && remoteHasAny(['remote.system.shutdown', 'remote.system.restart']);

  // Screenshot coordinate mapping
  function ssToScreenCoords(touchX, touchY) {
    if (!currentSsBounds) return null;
    const vp = $ssImg.parentElement;
    const vpW = vp.offsetWidth, vpH = vp.offsetHeight;
    const imgW = $ssImg.offsetWidth, imgH = $ssImg.offsetHeight;
    // 圖片左上角在 viewport 中的位置（含 pan/scale）
    const originX = vpW / 2 + ssTx - (imgW * ssScale) / 2;
    const originY = vpH / 2 + ssTy - (imgH * ssScale) / 2;
    // 點在圖片內的相對位置（0-1）
    const relX = (touchX - originX) / (imgW * ssScale);
    const relY = (touchY - originY) / (imgH * ssScale);
    if (relX < 0 || relX > 1 || relY < 0 || relY > 1) return null;
    // 映射到桌面物理座標
    const b = currentSsBounds;
    return { x: Math.round(b.x + relX * b.w), y: Math.round(b.y + relY * b.h) };
  }

  // ── 分欄（對齊桌面 groupNewsItemsByKeyword）──
  function nrGroupByKeyword(items, sources) {
    const byId = new Map(sources.map(s => [s.id, s]));
    const breakout = [], local = [], other = [];
    const kw = new Map(), feed = new Map();
    // 依 settings.sources 順序預建關鍵字框，欄位順序才跟桌面一致
    for (const s of sources) {
      if (s.type === 'keyword' && s.enabled) kw.set(s.id, { label: s.label, items: [] });
    }
    for (const item of items) {
      if (item.breakout === true) { breakout.push(item); continue; }
      if (String(item.sourceId || '').indexOf('loc-') === 0) { local.push(item); continue; }
      const src = byId.get(item.sourceId);
      if ((src && src.type === 'keyword') || item.sourceType === 'keyword') {
        const key = src ? src.id : item.sourceId;
        const label = (src && src.label) || item.keyword || item.source || key;
        const bucket = kw.get(key);
        if (bucket) bucket.items.push(item);
        else kw.set(key, { label, items: [item] });
        continue;
      }
      if (src) {
        const bucket = feed.get(src.id);
        if (bucket) bucket.items.push(item);
        else feed.set(src.id, { label: src.label, items: [item] });
        continue;
      }
      other.push(item);
    }
    const out = [];
    if (breakout.length) out.push({ groupId: NR_BREAKOUT_ID, label: '🔥 熱門話題', items: breakout });
    for (const [id, b] of kw) if (b.items.length) out.push({ groupId: 'kw:' + id, label: b.label, items: b.items });
    if (local.length) out.push({ groupId: NR_LOCAL_ID, label: '📍 地方新聞', items: local });
    for (const [id, b] of feed) if (b.items.length) out.push({ groupId: 'feed:' + id, label: b.label, items: b.items });
    if (other.length) out.push({ groupId: NR_OTHER_ID, label: '其他', items: other });
    return out;
  }

  function nrFormatTime(iso) {
    if (!iso) return '';
    const t = new Date(iso).getTime();
    if (isNaN(t)) return '';
    const mins = Math.floor((Date.now() - t) / 60000);
    if (mins < 1) return '剛剛';
    if (mins < 60) return mins + ' 分鐘前';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' 小時前';
    const days = Math.floor(hours / 24);
    if (days < 7) return days + ' 天前';
    try { return new Date(iso).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch { return iso; }
  }

  function nrIsPinned(id) { return readerState.pinnedItems.some(p => p.id === id); }

  function nrSectionQuota(sectionGroupId) {
    if (sectionGroupId === NR_BREAKOUT_ID) return readerState.readerBreakoutQuota;
    if (sectionGroupId.indexOf('kw:') === 0) {
      const src = readerState.sources.find(s => s.id === sectionGroupId.slice(3));
      if (src && typeof src.readerQuota === 'number' && src.readerQuota >= 1) return src.readerQuota;
    }
    return readerState.readerPerKeyword;
  }
